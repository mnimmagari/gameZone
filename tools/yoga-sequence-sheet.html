<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Surya Namaskar: all 12 poses</title>
<style>
body{margin:0;background:#f6e4d8;color:#5a3a30;font:15px/1.35 system-ui,sans-serif}
h1{margin:10px 14px 2px;font-size:19px}p.s{margin:0 14px 6px;font-size:12px;color:#8a6a5c}
#wrap{position:relative;width:min(1600px,100%);max-width:calc((100vh - 64px)*4/3);margin:0 auto}canvas{display:block;width:100%;height:auto}
#grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
#grid div{display:flex;flex-direction:column;justify-content:flex-end;padding:6px 10px;border:1px solid rgba(160,110,90,.25);box-sizing:border-box}
#grid b{font-size:15px;background:rgba(255,247,241,.85);padding:2px 8px;border-radius:10px;align-self:flex-start}
#grid small{font-size:12px;color:#7a5a4c;background:rgba(255,247,241,.7);padding:1px 8px;border-radius:8px;align-self:flex-start;margin-top:2px}
</style></head><body>
<h1>Surya Namaskar: the 12 poses in order</h1>
<p class="s">Three-quarter view of each pose. Poses 5 and 8, 4 and 9 (left and right leg back), 3 and 10, 2 and 11, 1 and 12 are the traditional pairs.</p>
<div id="wrap"><canvas id="c" width="1600" height="1200"></canvas><div id="grid"></div></div>
<script src="../assets/vendor/three-mx.js"></script>
<script src="../assets/move/yoga/yoga-kid.js"></script>
<script src="../assets/move/yoga/yoga-poses.js"></script>
<script>
const T=MXTHREE.THREE,c=document.getElementById('c'),P=MXYogaPoses;
const r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(1);r.setSize(1600,1200,false);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const sc=new T.Scene();sc.background=new T.Color(0xf4dccb);sc.fog=new T.Fog(0xf4dccb,8,18);
sc.add(new T.HemisphereLight(0xfff1e4,0xe9b9a3,1.15));
const sun=new T.DirectionalLight(0xffe2c0,2.2);sun.position.set(-2.2,3.2,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-1.5,near:.5,far:12});sun.shadow.bias=-.0005;sc.add(sun);
const fill=new T.DirectionalLight(0xffd0d8,.8);fill.position.set(3,1.5,2);sc.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0xf0cdb9,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);
const MAT=.025,mat=new T.Mesh(new T.BoxGeometry(.7,MAT,1.6),new T.MeshStandardMaterial({color:0xe9b8a0,roughness:.85}));mat.position.set(0,MAT/2,-.05);mat.receiveShadow=true;sc.add(mat);
const K=MXYoga.build(T,{eyes:'open'});K.floorY=MAT;sc.add(K.root);
const cam=new T.PerspectiveCamera(30,1,.1,40);cam.position.set(2.6,1.05,2.6);cam.lookAt(0,.55,0);
const POSES=P.make(K.dim),grid=document.getElementById('grid');
POSES.forEach((p,i)=>{const d=document.createElement('div');d.innerHTML='<b>'+p.id+'. '+p.name+'</b><small>'+p.sub+' · '+p.breath+'</small>';grid.appendChild(d)});
r.setScissorTest(true);
POSES.forEach((p,i)=>{const col=i%4,row=Math.floor(i/4),x=col*400,y=(2-row)*400;P.solve(T,K,p.spec,0);K.idle(1.2);r.setViewport(x,y,400,400);r.setScissor(x,y,400,400);r.render(sc,cam)});
document.title='done';
</script></body></html>
