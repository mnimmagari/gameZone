<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Surya Namaskar character: Stage 1 turnaround</title>
<style>
body{margin:0;background:#f6e4d8;color:#5a3a30;font:15px/1.4 system-ui,sans-serif}
h1{margin:12px 16px 2px;font-size:20px}p.s{margin:0 16px 8px;color:#8a6a5c;font-size:13px}
#wrap{position:relative;width:min(1500px,100%);margin:0 auto}canvas{display:block;width:100%;height:auto;border-radius:14px}
#labels{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-weight:700;margin:4px 0 8px}
#bar{display:flex;gap:8px;flex-wrap:wrap;margin:6px 16px 12px}button{border:2px solid #d9a58f;background:#fff7f1;color:#5a3a30;padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer}button.on{background:#e9a98f;color:#fff}
#spec{margin:0 16px 20px;font-size:13px;color:#7a5a4c}
</style></head><body>
<h1>Surya Namaskar child: Stage 1 character approval</h1>
<p class="s">One rigged 3D character in neutral standing (Tadasana). Left to right: front, side, three-quarter. Nothing is animated yet except breathing, blinking and a swaying ponytail.</p>
<div id="wrap"><canvas id="c" width="1500" height="640"></canvas><div id="labels"><span>FRONT</span><span>SIDE</span><span>THREE-QUARTER</span></div></div>
<div id="bar"><button id="eyes">Eyes: open</button><button id="turn">Turntable: off</button><button id="grid">Height guides: off</button></div>
<div id="spec"></div>
<script src="../assets/vendor/three-mx.js"></script>
<script src="../assets/move/yoga/yoga-kid.js"></script>
<script>
const T=MXTHREE.THREE,W=1500,H=640,c=document.getElementById('c');
const r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(1);r.setSize(W,H,false);r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.0;r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
const sc=new T.Scene();sc.background=new T.Color(0xf4dccb);sc.fog=new T.Fog(0xf4dccb,6,14);
sc.add(new T.HemisphereLight(0xfff1e4,0xe9b9a3,1.15));
const sun=new T.DirectionalLight(0xffe2c0,2.2);sun.position.set(-2.2,3.2,2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-2,right:2,top:2,bottom:-1,near:.5,far:12});sun.shadow.bias=-.0005;sun.shadow.radius=5;sc.add(sun);
const fillL=new T.DirectionalLight(0xffd0d8,.8);fillL.position.set(3,1.5,2);sc.add(fillL);
const floor=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0xf0cdb9,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;sc.add(floor);
const mat=new T.Mesh(new T.BoxGeometry(1.15,.025,.62),new T.MeshStandardMaterial({color:0xe9b8a0,roughness:.85}));mat.position.y=.0125;mat.receiveShadow=true;mat.castShadow=true;sc.add(mat);
const K=MXYoga.build(T,{eyes:'open'});K.root.position.y=.025;sc.add(K.root);
/* neutral standing: arms relaxed at the sides, feet together */
K.armL.up.rotation.z=.1;K.armR.up.rotation.z=-.1;K.armL.fore.rotation.z=.05;K.armR.fore.rotation.z=-.05;
/* height guides */
const guides=new T.Group();guides.visible=false;sc.add(guides);
for(const h of [0,.46,.75,.93,1.12]){const l=new T.Mesh(new T.PlaneGeometry(3,.004),new T.MeshBasicMaterial({color:0x8a5a48}));l.position.set(0,.025+h,-.5);guides.add(l)}
const cams=[['front',0,.74,3.1],['side',3.1,.74,0],['three-quarter',2.2,.85,2.2]].map(a=>{const cam=new T.PerspectiveCamera(27,1500/3/H,.1,40);cam.position.set(a[1],a[2],a[3]);cam.lookAt(0,.62,0);return cam});
let turn=false,t0=performance.now();
function frame(){requestAnimationFrame(frame);const t=(performance.now()-t0)/1000;K.idle(t);
 if(turn)K.root.rotation.y=t*.6;else K.root.rotation.y=0;
 r.setScissorTest(true);for(let i=0;i<3;i++){const x=i*(W/3);r.setViewport(x,0,W/3,H);r.setScissor(x,0,W/3,H);r.render(sc,cams[i])}}
frame();
document.getElementById('eyes').onclick=e=>{const o=e.target.textContent.includes('open');K.setEyes(o?'closed':'open');e.target.textContent='Eyes: '+(o?'closed':'open')};
document.getElementById('turn').onclick=e=>{turn=!turn;e.target.textContent='Turntable: '+(turn?'on':'off');e.target.classList.toggle('on',turn)};
document.getElementById('grid').onclick=e=>{guides.visible=!guides.visible;e.target.textContent='Height guides: '+(guides.visible?'on':'off');e.target.classList.toggle('on',guides.visible)};
/* measured from the rig */
K.root.updateMatrixWorld(true);const bb=new T.Box3().setFromObject(K.root);const hgt=(bb.max.y-bb.min.y);
const hh=K.dim.headR*2.16;
document.getElementById('spec').innerHTML='<b>Proportions (measured):</b> total height '+hgt.toFixed(2)+' m (a child of about 5 to 6 years), head height '+hh.toFixed(2)+' m = about '+(hgt/hh).toFixed(1)+' heads tall (soft clay-doll look, like the reference). <b>Rig:</b> root, pelvis, spine, head, shoulder, upper arm, forearm, hand (x2), thigh, shin, foot (x2), five ponytail segments. <b>Outfit:</b> cream knit sweater with button placket and ribbed hem and cuffs, matching trousers, cream socks, knit headband. <b>Hair:</b> chestnut, side-swept fringe, ponytail. <b>Face:</b> rosy cheeks, calm eyes (open or closed).';
</script></body></html>
